name: outbox-dispatch-watchdog

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: outbox-dispatch-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the latest default branch
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use the supported Node runtime
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Assess scheduled outbox delivery
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCHDOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_SCHEDULE_GRACE_MS: '900000'
          WATCHDOG_WORKER_DEADLINE_MS: '120000'
          WATCHDOG_API_TIMEOUT_MS: '10000'
          WATCHDOG_MAX_PAGES: '2'
          WATCHDOG_PER_PAGE: '100'
        run: node scripts/github-outbox-dispatch-watchdog.mjs
