name: e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Validate original exercise catalogue
        run: npm run validate:catalog
      - name: Enforce runtime DDL boundary
        run: npm run check:runtime-ddl
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Rehearse local database migrations
        run: npm run test:migrations
      - name: Run API tests with enforced coverage
        run: npm run test:coverage
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against checkout
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
