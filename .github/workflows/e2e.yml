name: e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate original exercise catalogue
        env:
          # ubuntu-24.04 carries an offline Go toolchain on PATH. Fail closed if
          # that image contract changes; never download a compiler in a sandbox.
          CATALOG_REQUIRE_GO: 'true'
        run: npm run validate:catalog
      - name: Enforce runtime DDL boundary
        run: npm run check:runtime-ddl
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Verify checked-in CRDT bundle matches pinned sources
        run: npm run check:crdt
      - name: Rehearse local database migrations
        run: npm run test:migrations
      - name: Run API tests with enforced coverage
        run: npm run test:coverage
      - name: Let apt wait for the runner's dpkg lock
        # ubuntu-24.04 images (20261111+) can still hold the dpkg frontend
        # lock from boot-time apt work, and a timed-out first install attempt
        # leaves its orphaned apt-get holding it. Wait for the lock instead of
        # failing the retry immediately with exit code 100.
        run: echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against checkout
        # Full suite, Chromium-only: test:e2e is bare `playwright test`,
        # which would otherwise also run the firefox-smoke / webkit-smoke
        # projects. Pin to chromium here (and in ubuntu-26-canary.yml).
        run: npm run test:e2e -- --project=chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
  secondary-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Let apt wait for the runner's dpkg lock
        # ubuntu-24.04 images (20261111+) can still hold the dpkg frontend
        # lock from boot-time apt work, and a timed-out first install attempt
        # leaves its orphaned apt-get holding it. Wait for the lock instead of
        # failing the retry immediately with exit code 100.
        run: echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify secondary workspace and context cleanup
        run: >-
          npx playwright test tests/e2e/secondary-workspace-real-runtime.spec.ts
          tests/e2e/board-sync.spec.ts tests/e2e/circle-archive.spec.ts
          tests/e2e/member-lifecycle.spec.ts --project=chromium
          --grep='real runtime: both directions|real runtime: flag-off gates|a board edit reloaded before its debounce|archive session loss stays signed out|a delayed member mutation cannot restore'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-secondary-workspace-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
  # Cross-browser smoke (issue #399): the @smoke subset only, on Firefox
  # and WebKit, in parallel with the full-suite `e2e` job. Non-required at
  # first (not in branch protection): promote to required after ~2 weeks
  # of green runs. Each matrix leg installs only its own browser; the
  # smoke run itself is ~1 min of test time per engine.
  cross-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Run inside the official Playwright image (issue #478): its browsers and
    # their system libraries are preinstalled, so these legs no longer download
    # ~125 MB of WebKit/Firefox dependencies from the Ubuntu mirror on every run
    # (slow-mirror timeouts and orphaned-apt locks failed the install step).
    # The tag must match @playwright/test in package-lock.json and the image is
    # pinned by its index digest; tests/unit/github-actions-runtime.test.mjs
    # enforces both.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            project: firefox-smoke
          - browser: webkit
            project: webkit-smoke
    env:
      # Firefox refuses to run as root under a foreign HOME inside the container.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify the preinstalled browser matches the lockfile
        run: |
          npx playwright --version
          test "$(npx playwright --version)" = "Version $(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
      - name: Run cross-browser smoke tests
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
