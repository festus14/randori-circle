name: Credential key control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, first-adopt, or monotonically advance one key purpose
        required: true
        type: choice
        options: [status, adopt, advance]
      purpose:
        description: Credential-key purpose
        required: true
        type: choice
        options: [email-activation, password-reset, invitation-email, identity-email-observation]
      expected_version:
        description: Advance only; currently accepted version
        required: false
        type: string
      expected_generation:
        description: Advance only; currently accepted generation
        required: false
        type: string
      confirmation:
        description: INSPECT_CREDENTIAL_KEY_CONTROL or CHANGE_CREDENTIAL_KEY_CONTROL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: turso-production-database-operations
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: credential-key-control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          PURPOSE: ${{ inputs.purpose }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "${PURPOSE}" in
            email-activation|password-reset|invitation-email|identity-email-observation) ;;
            *) exit 1 ;;
          esac
          if [[ "${OPERATION}" = 'status' ]]; then
            test "${CONFIRMATION}" = 'INSPECT_CREDENTIAL_KEY_CONTROL'
            test -z "${EXPECTED_VERSION}"
            test -z "${EXPECTED_GENERATION}"
          elif [[ "${OPERATION}" = 'adopt' ]]; then
            test "${CONFIRMATION}" = 'CHANGE_CREDENTIAL_KEY_CONTROL'
            test -z "${EXPECTED_VERSION}"
            test -z "${EXPECTED_GENERATION}"
          elif [[ "${OPERATION}" = 'advance' ]]; then
            test "${CONFIRMATION}" = 'CHANGE_CREDENTIAL_KEY_CONTROL'
            [[ "${EXPECTED_VERSION}" =~ ^[1-9][0-9]*$ ]]
            [[ "${EXPECTED_GENERATION}" =~ ^[1-9][0-9]*$ ]]
          else
            exit 1
          fi

      - name: Check out latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Refuse a stale checkout
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "${DEFAULT_BRANCH}" = 'main'
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          checked_out_commit="$(git rev-parse HEAD)"
          latest_main_commit="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          test "${checked_out_commit}" = "${latest_main_commit}"
          echo "KEY_CONTROL_REPO_COMMIT=${checked_out_commit}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run protected key-control operation
        env:
          NODE_ENV: production
          KEY_CONTROL_GITHUB_ENVIRONMENT: credential-key-control
          KEY_CONTROL_CONFIRM: ${{ inputs.confirmation }}
          KEY_CONTROL_OPERATION: ${{ inputs.operation }}
          KEY_CONTROL_PURPOSE: ${{ inputs.purpose }}
          KEY_CONTROL_EXPECTED_VERSION: ${{ inputs.expected_version }}
          KEY_CONTROL_EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          CREDENTIAL_KEY_CONTROL_MUTATIONS_ENABLED: ${{ vars.CREDENTIAL_KEY_CONTROL_MUTATIONS_ENABLED }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_PRODUCTION_DATABASE_HOST: ${{ vars.TURSO_PRODUCTION_DATABASE_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_VERIFICATION_ENCRYPTION_KEY: ${{ secrets.EMAIL_VERIFICATION_ENCRYPTION_KEY }}
          EMAIL_VERIFICATION_ENCRYPTION_KEY_VERSION: ${{ vars.EMAIL_VERIFICATION_ENCRYPTION_KEY_VERSION }}
          EMAIL_VERIFICATION_ENCRYPTION_PREVIOUS_KEYS: ${{ secrets.EMAIL_VERIFICATION_ENCRYPTION_PREVIOUS_KEYS }}
          EMAIL_VERIFICATION_ENVELOPE_WRITE_VERSION: ${{ vars.EMAIL_VERIFICATION_ENVELOPE_WRITE_VERSION }}
          PASSWORD_RESET_ENCRYPTION_KEY: ${{ secrets.PASSWORD_RESET_ENCRYPTION_KEY }}
          PASSWORD_RESET_ENCRYPTION_KEY_VERSION: ${{ vars.PASSWORD_RESET_ENCRYPTION_KEY_VERSION }}
          PASSWORD_RESET_ENCRYPTION_PREVIOUS_KEYS: ${{ secrets.PASSWORD_RESET_ENCRYPTION_PREVIOUS_KEYS }}
          PASSWORD_RESET_ENVELOPE_WRITE_VERSION: ${{ vars.PASSWORD_RESET_ENVELOPE_WRITE_VERSION }}
          INVITATION_EMAIL_ENCRYPTION_KEY: ${{ secrets.INVITATION_EMAIL_ENCRYPTION_KEY }}
          INVITATION_EMAIL_ENCRYPTION_KEY_VERSION: ${{ vars.INVITATION_EMAIL_ENCRYPTION_KEY_VERSION }}
          INVITATION_EMAIL_ENCRYPTION_PREVIOUS_KEYS: ${{ secrets.INVITATION_EMAIL_ENCRYPTION_PREVIOUS_KEYS }}
          INVITATION_EMAIL_ENVELOPE_WRITE_VERSION: ${{ vars.INVITATION_EMAIL_ENVELOPE_WRITE_VERSION }}
          IDENTITY_EMAIL_HASH_KEY: ${{ secrets.IDENTITY_EMAIL_HASH_KEY }}
          IDENTITY_EMAIL_HASH_KEY_VERSION: ${{ vars.IDENTITY_EMAIL_HASH_KEY_VERSION }}
          IDENTITY_EMAIL_HASH_PREVIOUS_KEYS: ${{ secrets.IDENTITY_EMAIL_HASH_PREVIOUS_KEYS }}
        run: |
          node scripts/credential-key-control.mjs \
            --operation "${KEY_CONTROL_OPERATION}" \
            --purpose "${KEY_CONTROL_PURPOSE}" \
            --expected-version "${KEY_CONTROL_EXPECTED_VERSION}" \
            --expected-generation "${KEY_CONTROL_EXPECTED_GENERATION}"
