name: Credential expiry

# Advisory operations signal, not a PR/merge check. The checker itself is
# entirely offline; checkout/setup-node run before secrets enter the process.
on:
  schedule:
    - cron: '43 6 * * *' # Daily at 06:43 UTC; avoid the busy top of the hour.
  workflow_dispatch:

permissions: {}

concurrency:
  group: credential-expiry
  cancel-in-progress: false

jobs:
  credential-expiry:
    if: github.repository == 'festus14/randori-circle' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Inspect expiry claims offline (names and days only)
        timeout-minutes: 1
        # GitHub automatically masks secret values in runner logs. Never
        # interpolate them into run, echo them, or upload credential artifacts.
        env:
          DELETION_LEDGER_AUTH_TOKEN: ${{ secrets.DELETION_LEDGER_AUTH_TOKEN }}
          TURSO_AUTH_TOKEN_EXPIRY_WATCH: ${{ secrets.TURSO_AUTH_TOKEN_EXPIRY_WATCH }}
        run: node scripts/credential-expiry-check.mjs
