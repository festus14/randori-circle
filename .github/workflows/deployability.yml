name: deployability
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/issue-87-repository-deployability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployability:
    name: deployability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate repository release contract
        run: npm run check:deployability
      - name: Validate secret-free backup controls
        run: npm run check:backup-controls
      - name: Test release-contract failure modes
        run: npm run test:deployability
