name: deployability
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/issue-87-repository-deployability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployability:
    name: deployability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The theme-toggle-axe guard parses specs with the pinned typescript
      # devDependency (#419, precursor #423), so this job installs
      # dependencies before the checks run.
      - name: Install dependencies
        run: npm ci
      - name: Validate repository release contract
        run: npm run check:deployability
      - name: Validate secret-free backup controls
        run: npm run check:backup-controls
      - name: Validate documentation drift
        run: npm run check:docs
      - name: Validate theme-toggle-axe settle guard
        run: npm run check:theme-toggle-axe
      - name: Validate CSS/JS byte budget
        run: npm run check:byte-budget
      - name: Test release-contract failure modes
        run: npm run test:deployability
