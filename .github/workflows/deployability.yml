name: deployability
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/issue-87-repository-deployability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployability:
    name: deployability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate repository release contract
        run: npm run check:deployability
      - name: Validate secret-free backup controls
        run: npm run check:backup-controls
      - name: Test release-contract failure modes
        run: npm run test:deployability
