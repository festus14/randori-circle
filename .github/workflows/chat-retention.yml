name: Chat retention

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected staging or production environment
        required: true
        type: environment
      operation:
        description: Count-only inspection, dry run, bounded purge, or protected state transition
        required: true
        type: choice
        options:
          - status
          - dry-run
          - purge
          - enable
          - disable
          - adopt-scope
          - hold-tenant
          - hold-room
          - release-tenant
          - release-room
          - replay
      confirmation:
        description: Exact operation confirmation phrase from the runbook
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: turso-production-database-operations
  cancel-in-progress: false

jobs:
  retention:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate protected operation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            status) expected='INSPECT_CHAT_RETENTION' ;;
            dry-run) expected='DRY_RUN_CHAT_RETENTION' ;;
            purge) expected='PURGE_EXPIRED_CHAT' ;;
            enable) expected='ENABLE_CHAT_RETENTION' ;;
            disable) expected='DISABLE_CHAT_RETENTION' ;;
            adopt-scope) expected='ADOPT_CHAT_SCOPE' ;;
            hold-tenant|hold-room) expected='PLACE_CHAT_HOLD' ;;
            release-tenant|release-room) expected='RELEASE_CHAT_HOLD' ;;
            replay) expected='REPLAY_CHAT_RETENTION' ;;
            *) exit 2 ;;
          esac
          test "${CONFIRMATION}" = "${expected}"

      - name: Check out the latest default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Refuse stale workflow code
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${DEFAULT_BRANCH}")"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run bounded retention operation
        id: retention
        shell: bash
        env:
          CHAT_RETENTION_ACTION: ${{ inputs.operation == 'dry-run' && 'run' || inputs.operation == 'purge' && 'run' || inputs.operation }}
          CHAT_RETENTION_MODE: ${{ inputs.operation == 'purge' && 'purge' || 'dry_run' }}
          CHAT_RETENTION_ENABLED: ${{ vars.CHAT_RETENTION_ENABLED }}
          CHAT_RETENTION_EXPECTED_GENERATION: ${{ vars.CHAT_RETENTION_EXPECTED_GENERATION }}
          CHAT_RETENTION_SCOPE_KEY: ${{ secrets.CHAT_RETENTION_SCOPE_KEY }}
          CHAT_RETENTION_CIRCLE_ID: ${{ secrets.CHAT_RETENTION_CIRCLE_ID }}
          CHAT_RETENTION_WEEK_ID: ${{ secrets.CHAT_RETENTION_WEEK_ID }}
          CHAT_RETENTION_PAIR_GROUP_ID: ${{ secrets.CHAT_RETENTION_PAIR_GROUP_ID }}
          CHAT_RETENTION_RUN_ID: ${{ secrets.CHAT_RETENTION_RUN_ID }}
          CHAT_RETENTION_REASON_CODE: ${{ vars.CHAT_RETENTION_REASON_CODE }}
          CHAT_RETENTION_BACKUP_EVIDENCE_DIGEST: ${{ secrets.CHAT_RETENTION_BACKUP_EVIDENCE_DIGEST }}
          CHAT_RETENTION_BACKUP_SCOPE_BINDING_DIGEST: ${{ secrets.CHAT_RETENTION_BACKUP_SCOPE_BINDING_DIGEST }}
          CHAT_RETENTION_BACKUP_SOURCE_MAX_MESSAGE_ID: ${{ secrets.CHAT_RETENTION_BACKUP_SOURCE_MAX_MESSAGE_ID }}
          CHAT_RETENTION_BACKUP_THROUGH_AT: ${{ secrets.CHAT_RETENTION_BACKUP_THROUGH_AT }}
          CHAT_RETENTION_BACKUP_COMPLETED_AT: ${{ secrets.CHAT_RETENTION_BACKUP_COMPLETED_AT }}
          CHAT_RETENTION_EXPORT_EVIDENCE_DIGEST: ${{ secrets.CHAT_RETENTION_EXPORT_EVIDENCE_DIGEST }}
          CHAT_RETENTION_EXPORT_SCOPE_BINDING_DIGEST: ${{ secrets.CHAT_RETENTION_EXPORT_SCOPE_BINDING_DIGEST }}
          CHAT_RETENTION_EXPORT_SOURCE_MAX_MESSAGE_ID: ${{ secrets.CHAT_RETENTION_EXPORT_SOURCE_MAX_MESSAGE_ID }}
          CHAT_RETENTION_EXPORT_THROUGH_AT: ${{ secrets.CHAT_RETENTION_EXPORT_THROUGH_AT }}
          CHAT_RETENTION_EXPORT_COMPLETED_AT: ${{ secrets.CHAT_RETENTION_EXPORT_COMPLETED_AT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/chat-retention"
          timeout --signal=TERM --kill-after=30s 10m \
            node scripts/chat-retention.mjs > "${RUNNER_TEMP}/chat-retention/result.json"
          cat "${RUNNER_TEMP}/chat-retention/result.json"

      - name: Upload count-only retention evidence
        if: always() && steps.retention.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-retention/result.json
          retention-days: 30
          if-no-files-found: error
