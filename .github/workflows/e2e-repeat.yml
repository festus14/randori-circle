name: e2e-repeat (temporary)
# Temporary flake-hunting workflow for the round-2 flake PR. Removed before merge.
on:
  push:
    branches: [codex/e2e-flakes-round2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-repeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Timing-sensitive unit tests x40 under CPU saturation
        run: |
          for i in $(seq 1 8); do (timeout 900 yes > /dev/null &); done
          pass=0; fail=0
          for round in $(seq 1 5); do
            pids=()
            for i in $(seq 1 8); do
              node --experimental-test-module-mocks --test \
                --test-name-pattern="SIGTERM|saturat|fair rounds" \
                tests/unit/turso-backup-restore-rehearsal.test.mjs tests/unit/outbox.test.mjs \
                > "unit-$round-$i.txt" 2>&1 &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do if wait "$pid"; then pass=$((pass+1)); else fail=$((fail+1)); fi; done
          done
          pkill yes || true
          grep -h "^✖\|^✔" unit-*.txt | sed -E 's/ \([0-9.]+ms\)//' | sort | uniq -c
          echo "process runs: pass=$pass fail=$fail"
          test "$fail" -eq 0

  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Targeted specs x15
        env:
          CI: '1'
        run: >-
          npx playwright test --repeat-each=15 --reporter=list
          tests/e2e/schedule-sync.spec.ts tests/e2e/circle-invitations.spec.ts
          tests/e2e/app-shell-navigation.spec.ts tests/e2e/board-sync.spec.ts
          tests/e2e/secondary-schedule.spec.ts tests/e2e/session-controls.spec.ts
          tests/e2e/session-completion.spec.ts tests/e2e/meeting-link.spec.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: targeted
          path: test-results
          retention-days: 3
          if-no-files-found: ignore

  smooth-scroll-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Clicks on off-screen buttons under html{scroll-behavior:smooth}
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/probe.spec.mjs <<'SPEC'
          import { test, expect } from '@playwright/test';
          for (const motion of ['no-preference', 'reduce']) {
            test(`smooth-scroll click probe (${motion})`, async ({ browser }) => {
              const context = await browser.newContext({ reducedMotion: motion });
              const page = await context.newPage();
              await page.setContent(`<style>html{scroll-behavior:smooth}
                @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
                .spacer{height:2400px}</style>
                <div class="spacer"></div><button id="b">Go</button><div class="spacer"></div>
                <script>window.clicks=0;document.getElementById('b').addEventListener('click',()=>{window.clicks+=1;});
                setInterval(()=>{const end=performance.now()+25;while(performance.now()<end){}},40);</script>`);
              const attempts = 60;
              for (let i = 0; i < attempts; i += 1) {
                await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
                await page.locator('#b').click();
              }
              const clicks = await page.evaluate(() => window.clicks);
              console.log(`PROBE motion=${motion} attempts=${attempts} clicks=${clicks} lost=${attempts - clicks}`);
              await context.close();
              if (motion === 'reduce') expect(clicks).toBe(attempts);
            });
          }
          SPEC
          cp /tmp/probe/probe.spec.mjs tests/e2e/zz-probe.spec.mjs
          for i in $(seq 1 4); do (timeout 300 yes > /dev/null &); done
          npx playwright test tests/e2e/zz-probe.spec.mjs --reporter=list --workers=1 | grep -E "PROBE|passed|failed"
          pkill yes || true

  circle-regression-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Updated legacy-circle test fails deterministically without the app fix
        env:
          CI: '1'
        run: |
          grep -c "if(addRow&&!isAdmin()){" index.html
          sed -i 's/if(addRow&&!isAdmin()){/if(addRow){/' index.html
          set +e
          npx playwright test --repeat-each=5 --reporter=list tests/e2e/circle-invitations.spec.ts -g "flag-off legacy"
          status=$?
          set -e
          echo "exit status without fix: $status"
          test "$status" -ne 0

  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real-runtime journeys x6
        env:
          CI: '1'
        run: >-
          npx playwright test --repeat-each=6 --reporter=list
          tests/e2e/golden-pair-room-real-runtime.spec.ts tests/e2e/pairing-real-runtime.spec.ts
          tests/e2e/password-auth-journey-real-runtime.spec.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journeys
          path: test-results
          retention-days: 3
          if-no-files-found: ignore

  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'ubuntu-26.04']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full suite x2
        env:
          CI: '1'
        run: npx playwright test --repeat-each=2 --reporter=list
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-suite-${{ matrix.os }}
          path: test-results
          retention-days: 3
          if-no-files-found: ignore
