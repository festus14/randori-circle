name: execution-smoke

# Live check of the configured code-execution provider (#249). It calls the
# cron-secret-protected /api/cron/execution-smoke route, which runs one fixed
# trivial JavaScript and one fixed trivial Python program and returns bounded
# categories only. The route self-throttles (one real run per 30 minutes, two
# per rolling day); this job fails unless each language is ok, or throttled
# with a passing cached result.
#
# Only Vercel's own Production deployments trigger it. GitHub records a
# "production" deployment for every job that uses that environment (this one
# included), and expression string comparison ignores case, so the creator
# check is what stops those deployments from re-triggering this workflow.
on:
  deployment_status:
  schedule:
    - cron: '29 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-smoke:
    if: >-
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]') ||
      (github.event_name != 'deployment_status' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    concurrency:
      group: execution-smoke
      cancel-in-progress: false
    steps:
      - name: Check out the latest default branch
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use the supported Node runtime
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run the live execution smoke check
        timeout-minutes: 2
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXECUTION_SMOKE_TIMEOUT_MS: '100000'
        run: node scripts/github-execution-smoke.mjs
