name: execution-smoke

# Live check of the configured code-execution provider (#249). It calls the
# cron-secret-protected /api/cron/execution-smoke route, which runs one fixed
# trivial JavaScript and one fixed trivial Python program and returns bounded
# categories only. The route self-throttles (runs 30 minutes apart, one
# `schedule` run per 20 hours and one `deploy` run per 24 hours); this job
# fails unless each language is ok, or throttled with a passing cached result.
#
# Only Vercel's own Production deployments trigger it. GitHub records a
# "production" deployment for every job that uses that environment (this one
# included), and expression string comparison ignores case. The creator check
# drops those deployments, except when the run was itself started by Vercel's
# deployment: its environment deployment is then created by vercel[bot] too.
# Their statuses link to the Actions run (https://github.com/...), while
# Vercel's link to *.vercel.app, so the target URL check drops those as well
# (#342). The URL is read only in this condition, never in a step.
on:
  deployment_status:
  schedule:
    - cron: '29 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-smoke:
    if: >-
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      !startsWith(github.event.deployment_status.target_url, 'https://github.com/')) ||
      (github.event_name != 'deployment_status' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    concurrency:
      group: execution-smoke
      cancel-in-progress: false
    steps:
      - name: Check out the latest default branch
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use the supported Node runtime
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run the live execution smoke check
        timeout-minutes: 2
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXECUTION_SMOKE_TIMEOUT_MS: '100000'
          EXECUTION_SMOKE_TRIGGER: ${{ github.event_name == 'deployment_status' && 'deploy' || 'schedule' }}
        run: node scripts/github-execution-smoke.mjs
