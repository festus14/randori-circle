name: production-smoke

# Read-only synthetic check of the live production origin. The Vercel GitHub
# integration emits deployment_status events for environment "Production"
# (and "Preview"); only successful Production deployments created by Vercel run
# the check. GitHub also records a "production" deployment for every job that
# uses that environment, and expression comparison ignores case, so the creator
# check keeps those deployments from triggering it. A job in a run that Vercel's
# deployment started records its deployment as vercel[bot] too; its statuses
# link to the Actions run (https://github.com/...) rather than *.vercel.app, so
# the target URL check drops it (#342). The URL is read only in this condition.
# This workflow is informational and must never be a required status check.
on:
  deployment_status:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Origin to check (defaults to the production alias)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: production-smoke
    if: >-
      github.event_name != 'deployment_status' || (
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      !startsWith(github.event.deployment_status.target_url, 'https://github.com/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check the live production origin (read-only)
        timeout-minutes: 3
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: |
          if ! npm run smoke:production; then
            echo "::error title=Production smoke failed::A read-only production check failed. Inspect the run log and the latest Vercel production deployment."
            exit 1
          fi
